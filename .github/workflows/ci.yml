name: ServerApp CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  build-and-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Foundry workflow source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Foundry
          ref: 8bd3487a96af2cd7d667f62c4566a499bafe30dc
          path: _deps/Foundry
      - name: Checkout FSM_COS source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: cad5775fe55a6a8d0b6df8bbd22017c1179141c4
          path: _deps/FSM_COS
      - name: Checkout FSM_API source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_API
          ref: 4db572f5e0e74df028b01ee22fb393e2bd203eb6
          path: _deps/FSM_API
      - name: Checkout FSM_UserIO source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_UserIO
          ref: db5b59d0521a341f97e6077e3508eb2bd7171607
          path: _deps/FSM_UserIO
      - name: Checkout MicroBundleDomain source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: d8c1f52d3550591aec2337ad4470bfadb20fb11e
          path: _deps/TheSingularityWorkshop.MicroBundleDomain
      - name: Checkout DataWarehouse source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.DataWarehouse
          ref: a019d006dbb2eb4cb525cd3977c9eafaf6eee616
          path: _deps/TheSingularityWorkshop.DataWarehouse
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build core and CLI
        run: |
          dotnet build src/ServerApp.Cli/ServerApp.Cli.csproj --configuration Release
      - name: Build DataWarehouse integration
        run: |
          dotnet build src/ServerApp.DataWarehouse/ServerApp.DataWarehouse.csproj --configuration Release
      - name: Build machine report utility
        run: |
          dotnet build src/ServerApp.MachineReport/ServerApp.MachineReport.csproj --configuration Release
      - name: Build Foundry host integration
        run: |
          dotnet build src/ServerApp.FoundryHost/ServerApp.FoundryHost.csproj --configuration Release -p:WorkshopUseRepositorySources=true
      - name: Run core contract checks
        run: |
          dotnet run --project tests/ServerApp.ContractChecks/ServerApp.ContractChecks.csproj --configuration Release
      - name: Run DataWarehouse integration contract checks
        run: |
          dotnet run --project tests/ServerApp.DataWarehouse.ContractChecks/ServerApp.DataWarehouse.ContractChecks.csproj --configuration Release
      - name: Run Foundry host contract checks
        run: |
          dotnet run --project tests/ServerApp.FoundryHost.ContractChecks/ServerApp.FoundryHost.ContractChecks.csproj --configuration Release -p:WorkshopUseRepositorySources=true
