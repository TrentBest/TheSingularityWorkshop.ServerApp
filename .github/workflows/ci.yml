name: ServerApp CI

on:
  push:
    branches: [development, master, feature/**, work/**, integration/**]

permissions:
  contents: read

jobs:
  build-and-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout FSM_Execution workflow source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_Execution
          ref: 1eae217835707f46c5906412c8d0797ef0ff3fcd
          path: _deps/FSM_Execution
      - name: Checkout CiAi source and its source dependencies (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: 27d5959739b09d5c5e9205645261acaa456fa02e
          path: _deps/FSM_Execution/dependencies/CiAi
          submodules: recursive
      - name: Checkout FSM_COS source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: cad5775fe55a6a8d0b6df8bbd22017c1179141c4
          path: _deps/FSM_COS
      - name: Checkout FSM_API source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_API
          ref: 4db572f5e0e74df028b01ee22fb393e2bd203eb6
          path: _deps/FSM_API
      - name: Checkout FSM_UserIO source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_UserIO
          ref: db5b59d0521a341f97e6077e3508eb2bd7171607
          path: _deps/FSM_UserIO
      - name: Checkout MicroBundleDomain source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: d8c1f52d3550591aec2337ad4470bfadb20fb11e
          path: _deps/TheSingularityWorkshop.MicroBundleDomain
      - name: Checkout DataWarehouse source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.DataWarehouse
          ref: a019d006dbb2eb4cb525cd3977c9eafaf6eee616
          path: _deps/TheSingularityWorkshop.DataWarehouse
      - name: Checkout Economy simulation source (pinned)
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Economy
          ref: a62850001cbfc9e41c07ae1533d64d700542230b
          path: _deps/TheSingularityWorkshop.Economy
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build core and CLI
        run: |
          dotnet build src/ServerApp.Cli/ServerApp.Cli.csproj --configuration Release
      - name: Build Economy host integration
        run: |
          dotnet build src/ServerApp.Economy/ServerApp.Economy.csproj --configuration Release
      - name: Build DataWarehouse integration
        run: |
          dotnet build src/ServerApp.DataWarehouse/ServerApp.DataWarehouse.csproj --configuration Release
      - name: Build machine report utility
        run: |
          dotnet build src/ServerApp.MachineReport/ServerApp.MachineReport.csproj --configuration Release
      - name: Build Execution host integration
        run: |
          dotnet build src/ServerApp.ExecutionHost/ServerApp.ExecutionHost.csproj --configuration Release -p:WorkshopUseRepositorySources=true
      - name: Run pinned CiAi contract checks
        run: |
          dotnet run --project _deps/FSM_Execution/dependencies/CiAi/tests/TheSingularityWorkshop.CiAi.ContractTests/TheSingularityWorkshop.CiAi.ContractTests.csproj --configuration Release
      - name: Run core contract checks
        run: |
          dotnet run --project tests/ServerApp.ContractChecks/ServerApp.ContractChecks.csproj --configuration Release
      - name: Run DataWarehouse integration contract checks
        run: |
          dotnet run --project tests/ServerApp.DataWarehouse.ContractChecks/ServerApp.DataWarehouse.ContractChecks.csproj --configuration Release
      - name: Build database-free file store
        run: |
          dotnet build src/ServerApp.FileStore/ServerApp.FileStore.csproj --configuration Release
      - name: Run file-store durability contract checks
        run: |
          dotnet run --project tests/ServerApp.FileStore.ContractChecks/ServerApp.FileStore.ContractChecks.csproj --configuration Release
      - name: Run Execution host contract checks
        run: |
          dotnet run --project tests/ServerApp.ExecutionHost.ContractChecks/ServerApp.ExecutionHost.ContractChecks.csproj --configuration Release -p:WorkshopUseRepositorySources=true
